<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>C8J</title>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
    <script defer src="index.js"></script>
    <link rel="stylesheet" href="index.css"/>
</head>
<body>
<h1>C8J</h1>
<nav>

</nav>
<header>
    <time id="client-datetime"> <!-- script fills this --></time>
</header>
<main>
    <noscript><h2 style="color: #ff0000">Seems your browser doesn't support Javascript! Please enable
    Javascript and reload this page!</h2></noscript>
    <p>
        <section id="keypad-section">
            <button id="key1">1</button>
            <button id="key2">2</button>
            <button id="key3">3</button>
            <button id="keyc">C</button><br/>
            <button id="key4">4</button>
            <button id="key5">5</button>
            <button id="key6">6</button>
            <button id="keyd">D</button><br/>
            <button id="key7">7</button>
            <button id="key8">8</button>
            <button id="key9">9</button>
            <button id="keye">E</button><br/>
            <button id="keya">A</button>
            <button id="key0">0</button>
            <button id="keyb">B</button>
            <button id="keyf">F</button><br/>
        </section>
    </p>
    <p>
        <canvas id="main-canvas">
            C8J Display
        </canvas>
    </p>
    <p>
        <!--<form method="post" id="input-form"> -->
        <button id="start-button">START</button>
        <button id="stop-button">STOP</button>
        <button id="step-button">STEP</button>
        <button id="send-client-message">SEND MESSAGE</button>
        <span id="player-status-text">emulator status</span>
        <!-- </form> -->
    </p>
    <p id="c8j-messages-container">
        <h3>Server messages:</h3>
        <button id="clear-button">clear</button><br/>
     <textarea id="c8j-messages" rows="20" cols="80" readonly>

     </textarea>   
    </p>
</main>
<footer>
    <details>
        <summary> Logs </summary>
        <pre>
				dev logs could come here...
				another line of dev log....
		</pre>
    </details>

   
</footer>
</body>
</html>
