<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>C8J</title>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
    <script defer src="index.js"></script>
    <link rel="stylesheet" href="index.css"/>
</head>
<body>
<h1>C8J</h1>
<nav>

</nav>
<header>
    <time id="client-datetime"> <!-- script fills this --></time>
</header>
<main>
    <noscript><h2 style="color: #ff0000">Seems your browser doesn't support Javascript! Please enable
    Javascript and reload this page!</h2></noscript>
    <p> <button id="start-button">START</button> </p>
    <p>
    <form id="binary-file-form" method="post" enctype="multipart/form-data">
        <label for="binary-file-picker">Upload ch8 binary:</label>
        <input type="file" id="binary-file-picker" name="ch8-file" accept=".ch8" />
        <input type="submit" title="Upload ROM/Binary/CH8 to resume-button" id="upload-binary-button"/> 
    </form>
    </p>
    <p>
        <canvas id="main-canvas">
            C8J Display
        </canvas>
        <canvas id="off-canvas" hidden></canvas>
    </p>
    <p>
        <section id="keypad-section">
            <button class="keypad" id="1">1</button>
            <button class="keypad" id="2">2</button>
            <button class="keypad" id="3">3</button>
            <button class="keypad" id="c">C</button><br/>
            <button class="keypad" id="4">4</button>
            <button class="keypad" id="5">5</button>
            <button class="keypad" id="6">6</button>
            <button class="keypad" id="d">D</button><br/>
            <button class="keypad" id="7">7</button>
            <button class="keypad" id="8">8</button>
            <button class="keypad" id="9">9</button>
            <button class="keypad" id="e">E</button><br/>
            <button class="keypad" id="a">A</button>
            <button class="keypad" id="0">0</button>
            <button class="keypad" id="b">B</button>
            <button class="keypad" id="f">F</button><br/>
        </section>
    </p>
   
    <p>

        <!-- <button id="run-button">RUN</button> -->
        <button id="pause-button">PAUSE</button>
        <button id="step-button">STEP</button>
        <button id="request-frame-button">REQUEST-FRAME</button>
        <button id="resume-button">RESUME</button><br/>
        
        <!-- <button id="send-client-message-canary">SEND CANARY</button>
        <button id="send-client-message1">SEND MESSAGE1</button> -->
        
        <!-- </form> -->
    </p>
    <p><button id="stop-button">STOP</button></p>
    <p>
        EMULATION_STATE  = <span id="player-status-text"></span><br/>
        TIMESTAMP        = <span id="emu-server-timestamp"></span><br/>
        PROGRAM_COUNTER  = <span id="pc-value"></span><br/>
        INDEX_REGISTER   = <span id="i-value"></span><br/>
        V_REGISTERS_0-16 = <span id="v-values"></span><br/>
        STACK            = <span id="s-values"></span><br/>

    </p>
    
</main>
<footer>
    <details>
        <summary> Logs </summary>
        <button id="clear-button">clear</button><br />
        <p id="c8j-messages-container">
            <!-- <h3>Server messages:</h3> -->
            <textarea id="c8j-messages" rows="20" cols="80" readonly>

            </textarea>
        </p>
        <pre>
				dev logs could come here...
				another line of dev log....
		</pre>
    </details>


</footer>
</body>
</html>
